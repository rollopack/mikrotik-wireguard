<VirtualHost *:8080>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Static dashboard assets are versioned in their URLs and can be cached
    # aggressively; dynamic PHP responses define their own cache policy.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType text/javascript "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 year"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE application/javascript text/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # Router credentials are PHP config files and should never be web-addressable.
    <Directory /var/www/html/configs>
        Require all denied
    </Directory>

    # The project stores authentication material in dotfiles.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Make Authorization available to PHP for the public API bearer token.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
